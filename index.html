<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demont1eux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent:   #6b2fd4;
      --bright:   #9b5fff;
      --core:     #4206a9;
      --bg:       #03050f;
      --card:     rgba(8, 4, 26, 0.68);
      --border:   rgba(107,47,212,0.22);
      --text:     #edeaff;
      --muted:    #8272b5;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Manrope', ui-sans-serif, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    @media(min-height: 700px) {
      body { align-items: center; }
    }

    #sparks { position:fixed; inset:0; pointer-events:none; z-index:9998; }
    #avatar-sparks {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      pointer-events:none; z-index:2; border-radius:50%;
    }
    #sky { position:fixed; inset:0; pointer-events:none; z-index:-2; }

    /* ── BG ── */
    .bg-sky {
      position:fixed; inset:0; z-index:-3;
      background:
        radial-gradient(ellipse 85% 55% at 50% -5%,  #2a0878 0%, transparent 65%),
        radial-gradient(ellipse 55% 40% at 92% 110%, #12003a 0%, transparent 55%),
        radial-gradient(ellipse 45% 32% at 4%  92%,  #1a0060 0%, transparent 55%),
        #03050f;
      animation: bgReveal .4s ease both;
    }
    @keyframes bgReveal {
      from { opacity:0; } to { opacity:1; }
    }

    /* animação de entrada da página — fade simples */
    @keyframes pageEnter {
      from { opacity:0; }
      to   { opacity:1; }
    }
    body {
      animation: pageEnter .5s ease both;
    }

    /* flash roxo rápido no fundo ao entrar */
    .bg-flash {
      position:fixed; inset:0; z-index:-1; pointer-events:none;
      background: radial-gradient(ellipse 65% 55% at 50% 50%, rgba(107,47,212,0.28) 0%, transparent 70%);
      animation: bgFlash .65s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes bgFlash {
      0%   { opacity:0; transform:scale(0.8); }
      28%  { opacity:1; transform:scale(1.04); }
      100% { opacity:0; transform:scale(1.18); }
    }

    /* ── CARD ── */
    .card {
      width: min(405px, 92vw);
      padding: 38px 28px 30px;
      border-radius: 26px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(3px) saturate(1.5);
      box-shadow:
        0 0 0 1px rgba(107,47,212,0.09),
        0 10px 50px rgba(66,6,169,0.35),
        0 0 90px rgba(66,6,169,0.13);
      text-align: center;
      position: relative; z-index: 1;
      will-change: transform;
      animation: cardReveal .28s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardReveal {
      from { opacity:0; transform:translateY(20px) scale(0.96); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .card::before {
      content:''; position:absolute;
      top:0; left:50%; transform:translateX(-50%);
      width:50%; height:1px;
      background:linear-gradient(90deg,transparent,var(--bright),transparent);
      opacity:.5; border-radius:99px;
    }

    /* ── ENTRY ── */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    @keyframes popIn {
      0%   { opacity:0; transform:scale(0.5) rotate(-10deg); }
      60%  { opacity:1; transform:scale(1.08) rotate(2deg); }
      80%  { transform:scale(0.96) rotate(-1deg); }
      100% { opacity:1; transform:scale(1) rotate(0deg); }
    }
    @keyframes slideIn {
      from { opacity:0; transform:translateX(-10px); }
      to   { opacity:1; transform:translateX(0); }
    }

    /* nome — skew + blur + reveal rápido */
    @keyframes nameReveal {
      0%   { opacity:0; transform:translateY(6px) skewX(-8deg) scaleX(0.9); filter:blur(5px); }
      55%  { opacity:1; transform:translateY(0) skewX(1.5deg) scaleX(1.01); filter:blur(0); }
      78%  { transform:skewX(-0.5deg) scaleX(1); }
      100% { opacity:1; transform:translateY(0) skewX(0) scaleX(1); filter:blur(0); }
    }
    /* glow suave pulsando no nome depois de entrar */
    @keyframes nameGlow {
      0%,100% { filter:brightness(1); }
      50%     { filter:brightness(1.18) drop-shadow(0 0 8px rgba(155,95,255,0.5)); }
    }

    .avatar-wrap { animation: popIn .38s cubic-bezier(.34,1.56,.64,1) both; animation-delay:.07s; }
    h1 {
      animation: nameReveal .32s cubic-bezier(.22,1,.36,1) both, nameGlow 3.5s ease-in-out infinite;
      animation-delay: .16s, .7s;
    }
    .tags        { animation: fadeUp .2s cubic-bezier(.22,1,.36,1) both; animation-delay:.23s; }
    .btn:nth-child(1) { animation: slideIn .18s cubic-bezier(.22,1,.36,1) both; animation-delay:.28s; }
    .btn:nth-child(2) { animation: slideIn .18s cubic-bezier(.22,1,.36,1) both; animation-delay:.33s; }
    .btn:nth-child(3) { animation: slideIn .18s cubic-bezier(.22,1,.36,1) both; animation-delay:.37s; }
    .btn:nth-child(4) { animation: slideIn .18s cubic-bezier(.22,1,.36,1) both; animation-delay:.41s; }
    .btn:nth-child(5) { animation: slideIn .18s cubic-bezier(.22,1,.36,1) both; animation-delay:.45s; }
    footer { animation: fadeUp .18s ease both; animation-delay:.49s; }

    /* ── AVATAR ── */
    .avatar-wrap {
      position:relative; display:inline-flex;
      align-items:center; justify-content:center;
      margin-bottom:18px; width:128px; height:128px;
    }
    .avatar-spin {
      position:absolute; inset:-3px; border-radius:50%;
      background: conic-gradient(from 0deg,
        rgba(66,6,169,0.6), rgba(155,95,255,0.9),
        rgba(192,132,255,0.95), rgba(155,95,255,0.9), rgba(66,6,169,0.6)
      );
      animation: spin 3.5s linear infinite;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #fff calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #fff calc(100% - 2px));
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .avatar-wrap::before {
      content:''; position:absolute; inset:-10px; border-radius:50%;
      background: radial-gradient(circle, rgba(155,95,255,0.18) 0%, transparent 70%);
      animation: pulseGlow 2.5s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%,100% { opacity:.6; transform:scale(1); }
      50%     { opacity:1; transform:scale(1.08); }
    }
    .avatar {
      width:110px; height:110px; border-radius:50%; object-fit:cover;
      border:3px solid var(--bg); position:relative; z-index:1; display:block;
      transition: transform .4s cubic-bezier(.34,1.56,.64,1);
    }
    .avatar:hover { transform:scale(1.07) rotate(3deg); }

    /* ── NAME ── */
    h1 {
      font-size:26px; font-weight:800; letter-spacing:-.6px;
      background:linear-gradient(140deg,#fff 25%,#bf96ff 80%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; margin-bottom:9px;
    }

    /* ── TAGS ── */
    .tags { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin-bottom:24px; }
    .tag {
      font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
      color:var(--muted); background:rgba(107,47,212,0.1);
      border:1px solid rgba(107,47,212,0.22); padding:3px 10px; border-radius:99px;
    }

    /* ── LINKS ── */
    .links { display:flex; flex-direction:column; gap:9px; }

    .btn {
      text-decoration:none; color:var(--text);
      display:flex; align-items:center; gap:12px;
      padding:12px 15px; border-radius:14px;
      background:rgba(107,47,212,0.07);
      border:1px solid rgba(107,47,212,0.17);
      position:relative; overflow:hidden;
      transition: background .2s, border-color .2s, box-shadow .2s,
                  transform .24s cubic-bezier(.34,1.56,.64,1);
    }
    /* left accent bar */
    .btn::before {
      content:''; position:absolute;
      left:0; top:20%; bottom:20%; width:3px; border-radius:99px;
      background:linear-gradient(180deg,var(--bright),var(--core));
      opacity:0; transform:scaleY(0.2);
      transition:opacity .2s, transform .26s cubic-bezier(.34,1.56,.64,1);
    }
    .btn:hover::before { opacity:1; transform:scaleY(1); }
    /* shine sweep */
    .btn::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(110deg,transparent 28%,rgba(255,255,255,0.08) 50%,transparent 72%);
      transform:translateX(-130%); transition:transform .42s ease;
    }
    .btn:hover::after { transform:translateX(140%); }
    .btn:hover {
      background:rgba(107,47,212,0.2); border-color:rgba(155,95,255,0.48);
      box-shadow: 0 0 0 1px rgba(155,95,255,0.1), 0 0 22px rgba(66,6,169,0.45), 0 5px 20px rgba(0,0,0,0.4);
      transform:translateX(5px) scale(1.012);
    }

    /* ── ICON BOX ── */
    .btn-icon {
      width:37px; height:37px; border-radius:10px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(107,47,212,0.13); border:1px solid rgba(107,47,212,0.2);
      position:relative; overflow:hidden;
      transition: background .2s, box-shadow .2s, transform .24s cubic-bezier(.34,1.56,.64,1);
    }
    .btn-icon svg {
      width:16px; height:16px; fill:var(--bright);
      position:relative; z-index:1;
      transition: fill .2s;
    }

    /* ══ ANIMAÇÕES ÚNICAS POR PLATAFORMA ══ */

    /* Discord — shake nervoso */
    @keyframes iconWobble {
      0%,100%{ transform:rotate(0) scale(1); }
      18%   { transform:rotate(-14deg) scale(1.18); }
      36%   { transform:rotate(11deg) scale(1.12); }
      54%   { transform:rotate(-7deg) scale(1.06); }
      72%   { transform:rotate(4deg) scale(1.03); }
      88%   { transform:rotate(-2deg); }
    }
    /* Instagram — spin-in 360 */
    @keyframes iconSpin {
      from { transform:rotate(-200deg) scale(0.3); opacity:0; }
      to   { transform:rotate(0deg) scale(1); opacity:1; }
    }
    /* YouTube — lança da esquerda como play */
    @keyframes iconPlay {
      0%  { transform:scale(0.4) translateX(-6px); opacity:0; }
      65% { transform:scale(1.22) translateX(2px); opacity:1; }
      83% { transform:scale(0.95) translateX(0); }
      100%{ transform:scale(1) translateX(0); opacity:1; }
    }
    /* LivePix — heartbeat */
    @keyframes iconHeart {
      0%  { transform:scale(1); }
      18% { transform:scale(1.4); }
      36% { transform:scale(0.88); }
      54% { transform:scale(1.22); }
      72% { transform:scale(0.94); }
      86% { transform:scale(1.08); }
      100%{ transform:scale(1); }
    }
    /* TikTok — glitch duplo */
    @keyframes iconGlitch {
      0%  { transform:translate(0,0) scale(1); filter:none; }
      12% { transform:translate(-3px,1px) scale(1.12); filter:hue-rotate(80deg) brightness(1.3); }
      24% { transform:translate(3px,-2px) scale(1.06); filter:hue-rotate(-80deg); }
      36% { transform:translate(-2px,2px) scale(1.14); filter:brightness(1.5); }
      50% { transform:translate(2px,-1px) scale(1.08); filter:hue-rotate(40deg); }
      65% { transform:translate(-1px,0) scale(1.04); filter:none; }
      80% { transform:translate(0,1px) scale(1.02); }
      100%{ transform:translate(0,0) scale(1); filter:none; }
    }

    /* Aplicar animação no hover por plataforma */
    .btn[data-p="discord"]:hover .btn-icon svg    { fill:#fff; animation: iconWobble .42s ease both; }
    .btn[data-p="instagram"]:hover .btn-icon svg  { fill:var(--bright); animation: iconSpin .38s cubic-bezier(.34,1.56,.64,1) both; }
    .btn[data-p="youtube"]:hover .btn-icon svg    { fill:var(--bright); animation: iconPop .28s cubic-bezier(.34,1.56,.64,1) both; }
    .btn[data-p="livepix"]:hover .btn-icon svg    { fill:#e87aff; animation: iconHeart .5s ease both; }
    .btn[data-p="tiktok"]:hover .btn-icon svg     { fill:var(--bright); animation: iconGlitch .44s steps(1) both; }

    @keyframes iconPop {
      0%   { transform:scale(0.7); }
      60%  { transform:scale(1.15); }
      100% { transform:scale(1); }
    }

    /* cor do icon box por plataforma */
    .btn[data-p="discord"]:hover .btn-icon   { background:rgba(88,101,242,0.42);  box-shadow:0 0 16px rgba(88,101,242,0.55); }
    .btn[data-p="instagram"]:hover .btn-icon { background:rgba(107,47,212,0.35); box-shadow:0 0 16px rgba(155,95,255,0.5); }
    .btn[data-p="youtube"]:hover .btn-icon   { background:rgba(107,47,212,0.35); box-shadow:0 0 16px rgba(155,95,255,0.5); }
    .btn[data-p="livepix"]:hover .btn-icon   { background:rgba(220,80,255,0.32); box-shadow:0 0 16px rgba(220,80,255,0.5); }
    .btn[data-p="tiktok"]:hover .btn-icon    { background:rgba(107,47,212,0.35); box-shadow:0 0 16px rgba(155,95,255,0.5); }

    /* cor da borda do btn por plataforma */
    .btn[data-p="discord"]:hover   { border-color:rgba(88,101,242,0.55); }
    .btn[data-p="instagram"]:hover { border-color:rgba(155,95,255,0.48); }
    .btn[data-p="youtube"]:hover   { border-color:rgba(155,95,255,0.48); }
    .btn[data-p="livepix"]:hover   { border-color:rgba(200,70,255,0.48); }
    .btn[data-p="tiktok"]:hover    { border-color:rgba(155,95,255,0.48); }

    .btn-info { display:flex; flex-direction:column; align-items:flex-start; }
    .btn-label { font-weight:700; font-size:13.5px; }
    .btn-sub   { font-size:10.5px; color:var(--muted); font-weight:400; margin-top:1px; }

    .btn-arrow {
      margin-left:auto; flex-shrink:0; opacity:0; transform:translateX(-6px);
      transition:opacity .2s, transform .24s cubic-bezier(.34,1.56,.64,1);
      font-size:16px; color:var(--bright); font-weight:600; line-height:1;
    }
    .btn:hover .btn-arrow { opacity:1; transform:translateX(0); }

    footer { margin-top:22px; color:rgba(130,114,181,0.38); font-size:11px; font-weight:500; letter-spacing:.5px; }

    @media(max-width:480px){
      .card { padding:28px 14px 24px; width:100%; }
      h1 { font-size:21px; }
      .avatar { width:90px; height:90px; }
      .avatar-wrap { width:108px; height:108px; margin-bottom:14px; }
      .btn { padding:11px 12px; gap:10px; }
      .btn-icon { width:34px; height:34px; }
      .btn-label { font-size:13px; }
      .btn-sub { font-size:10px; }
      .tags { gap:5px; margin-bottom:20px; }
      .tag { font-size:9.5px; padding:2px 8px; }
      .links { gap:8px; }
    }

    @media(max-width:360px){
      .card { padding:22px 10px 20px; }
      h1 { font-size:19px; }
      .btn-arrow { display:none; }
    }
  </style>
</head>

      <span class="btn-icon"><svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.69a8.27 8.27 0 0 0 4.84 1.55V6.79a4.85 4.85 0 0 1-1.08-.1z"/></svg></span>

<script>
/* ══ SPARK TRAIL ══ */
const spC = document.getElementById('sparks');
const spX = spC.getContext('2d');
spC.width = window.innerWidth; spC.height = window.innerHeight;
window.addEventListener('resize', () => { spC.width = window.innerWidth; spC.height = window.innerHeight; });
const sparks = []; let lsx=-999, lsy=-999;
window.addEventListener('mousemove', e => {
  const dx=e.clientX-lsx, dy=e.clientY-lsy;
  if (Math.hypot(dx,dy)<10) return;
  lsx=e.clientX; lsy=e.clientY;
  for (let i=0;i<3;i++) {
    const a=Math.random()*Math.PI*2, spd=Math.random()*1.6+0.4;
    sparks.push({ x:e.clientX+(Math.random()-.5)*6, y:e.clientY+(Math.random()-.5)*6,
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd-.4, r:Math.random()*1.8+.6,
      life:1, decay:Math.random()*.045+.025, hue:Math.random()*50+260 });
  }
},{passive:true});
(function sparkLoop(){
  spX.clearRect(0,0,spC.width,spC.height);
  for (let i=sparks.length-1;i>=0;i--) {
    const s=sparks[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=.05; s.life-=s.decay;
    if (s.life<=0){sparks.splice(i,1);continue;}
    spX.beginPath(); spX.arc(s.x,s.y,s.r*s.life,0,Math.PI*2);
    spX.fillStyle=`hsla(${s.hue},100%,72%,${s.life*.75})`; spX.fill();
  }
  requestAnimationFrame(sparkLoop);
})();

/* ══ AVATAR ORBIT ══ */
const avatarWrap=document.getElementById('avatar-wrap');
const orbitC=document.getElementById('avatar-sparks');
const oCtx=orbitC.getContext('2d');
const OS=180; orbitC.width=OS; orbitC.height=OS;
const OX=OS/2, OY=OS/2;
const orbs=Array.from({length:22},(_,i)=>({
  angle:(i/22)*Math.PI*2+Math.random()*.4, radius:62+Math.random()*8,
  speed:(Math.random()*.008+.004)*(Math.random()<.5?1:-1),
  size:Math.random()*2+.5, alpha:Math.random()*.6+.2,
  hue:Math.random()*40+255, offset:Math.random()*10,
}));
let avHov=false;
avatarWrap.addEventListener('mouseenter',()=>avHov=true);
avatarWrap.addEventListener('mouseleave',()=>avHov=false);
const bSparks=[];
avatarWrap.addEventListener('mousemove',e=>{
  if(!avHov||Math.random()>.35) return;
  const rect=orbitC.getBoundingClientRect();
  const dx=e.clientX-(rect.left+rect.width/2), dy=e.clientY-(rect.top+rect.height/2);
  if(Math.hypot(dx,dy)>80) return;
  const ang=Math.atan2(dy,dx)+(Math.random()-.5)*1.2;
  bSparks.push({ x:OX+dx*(OS/(rect.width||180)), y:OY+dy*(OS/(rect.height||180)),
    vx:Math.cos(ang)*(Math.random()*2+1), vy:Math.sin(ang)*(Math.random()*2+1),
    r:Math.random()*2+.8, life:1, decay:Math.random()*.04+.025, hue:Math.random()*50+255 });
});
(function orbitLoop(ts){
  oCtx.clearRect(0,0,OS,OS);
  orbs.forEach(p=>{
    p.angle+=p.speed*(avHov?1.6:1);
    const wobble=Math.sin(ts*.001+p.offset)*4, r=p.radius+wobble;
    const x=OX+Math.cos(p.angle)*r, y=OY+Math.sin(p.angle)*r;
    const alpha=avHov?Math.min(1,p.alpha*2.2):p.alpha*(.5+.5*Math.sin(ts*.0012+p.offset));
    oCtx.beginPath(); oCtx.arc(x,y,p.size,0,Math.PI*2);
    oCtx.fillStyle=`hsla(${p.hue},100%,75%,${alpha})`; oCtx.fill();
    oCtx.beginPath();
    const tx=OX+Math.cos(p.angle-p.speed*8)*r, ty=OY+Math.sin(p.angle-p.speed*8)*r;
    oCtx.moveTo(x,y); oCtx.lineTo(tx,ty);
    oCtx.strokeStyle=`hsla(${p.hue},100%,70%,${alpha*.4})`; oCtx.lineWidth=p.size*.8; oCtx.stroke();
  });
  for (let i=bSparks.length-1;i>=0;i--) {
    const s=bSparks[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=.04; s.life-=s.decay;
    if(s.life<=0){bSparks.splice(i,1);continue;}
    oCtx.beginPath(); oCtx.arc(s.x,s.y,s.r*s.life,0,Math.PI*2);
    oCtx.fillStyle=`hsla(${s.hue},100%,78%,${s.life*.9})`; oCtx.fill();
  }
  requestAnimationFrame(orbitLoop);
})();

/* ══ SKY ══ */
const sky=document.getElementById('sky'); const sCtx=sky.getContext('2d');
let W=sky.width=window.innerWidth, H=sky.height=window.innerHeight;
let mx=W/2, my=H/2;
window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;},{passive:true});
window.addEventListener('resize',()=>{W=sky.width=window.innerWidth;H=sky.height=window.innerHeight;});
const STARS=Array.from({length:160},()=>({
  x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,
  a:Math.random()*.55+.1,freq:Math.random()*.002+.0007,ph:Math.random()*Math.PI*2
}));
const SHOTS=[],RR=115;
function spawnShot(){
  const ang=Math.PI/7+Math.random()*(Math.PI/7),spd=Math.random()*7+5;
  SHOTS.push({x:Math.random()*W*.85,y:Math.random()*H*.45,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
    len:Math.random()*90+55,w:Math.random()*1.2+.7,life:1,decay:Math.random()*.009+.006});
}
function burstSpawn(){const n=Math.floor(Math.random()*3)+2;for(let i=0;i<n;i++)setTimeout(spawnShot,i*(Math.random()*200+80));}
burstSpawn(); setInterval(()=>{if(SHOTS.length<12)burstSpawn();},900);
(function skyLoop(ts){
  sCtx.clearRect(0,0,W,H);
  STARS.forEach(s=>{
    const tw=.3+.7*((Math.sin(ts*s.freq+s.ph)+1)/2);
    const dx=s.x-mx,dy=s.y-my,d=Math.hypot(dx,dy);
    let px=s.x,py=s.y,a=s.a*tw;
    if(d<RR&&d>1){const t=1-d/RR,ang=Math.atan2(dy,dx);px+=Math.cos(ang)*t*42;py+=Math.sin(ang)*t*42;a*=d/RR;}
    sCtx.beginPath();sCtx.arc(px,py,s.r,0,Math.PI*2);sCtx.fillStyle=`rgba(200,180,255,${a})`;sCtx.fill();
  });
  for(let i=SHOTS.length-1;i>=0;i--){
    const sh=SHOTS[i];sh.x+=sh.vx;sh.y+=sh.vy;sh.life-=sh.decay;
    if(sh.life<=0||sh.x>W+100||sh.y>H+100){SHOTS.splice(i,1);continue;}
    const mag=Math.hypot(sh.vx,sh.vy);
    const tx=sh.x-(sh.vx/mag)*sh.len,ty=sh.y-(sh.vy/mag)*sh.len;
    const g=sCtx.createLinearGradient(sh.x,sh.y,tx,ty);
    g.addColorStop(0,`rgba(230,210,255,${sh.life})`);g.addColorStop(.25,`rgba(150,100,255,${sh.life*.65})`);g.addColorStop(1,`rgba(80,30,180,0)`);
    sCtx.beginPath();sCtx.moveTo(sh.x,sh.y);sCtx.lineTo(tx,ty);
    sCtx.strokeStyle=g;sCtx.lineWidth=sh.w*sh.life;sCtx.lineCap='round';sCtx.stroke();
    sCtx.beginPath();sCtx.arc(sh.x,sh.y,sh.w*2*sh.life,0,Math.PI*2);
    sCtx.fillStyle=`rgba(240,225,255,${sh.life*.95})`;sCtx.fill();
  }
  requestAnimationFrame(skyLoop);
})();

/* ══ CARD TILT ══ */
const card=document.getElementById('card');
let ttx=0,tty=0,ctX=0,ctY=0;
window.addEventListener('mousemove',e=>{
  const r=card.getBoundingClientRect();
  ttx=((e.clientY-(r.top+r.height/2))/(H/2))*-4.5;
  tty=((e.clientX-(r.left+r.width/2))/(W/2))*4.5;
},{passive:true});
window.addEventListener('mouseleave',()=>{ttx=0;tty=0;});
(function tiltLoop(ts){
  ctX+=(ttx-ctX)*.065;ctY+=(tty-ctY)*.065;
  const fy=Math.sin(ts*.001*(Math.PI*2/6))*9;
  card.style.transform=`perspective(900px) rotateX(${ctX}deg) rotateY(${ctY}deg) translateY(${fy}px)`;
  requestAnimationFrame(tiltLoop);
})();

/* ══ REANIMAR ÍCONE A CADA HOVER ══ */
document.querySelectorAll('.btn').forEach(btn => {
  const svg = btn.querySelector('svg');
  btn.addEventListener('mouseenter', () => {
    svg.style.animation = 'none';
    void svg.offsetWidth; // force reflow
    svg.style.animation = '';
  });
});
</script>
</body>
